<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 608">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d3558"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a72c"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c5968"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="608" fill="#fafbfc"/>
  <rect x="0" y="0" width="1000" height="4" fill="#d4a72c"/>
  <text x="24" y="28" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700" fill="#0d3558">The documents we produce.</text>
  <text x="24" y="46" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#4c5968">Representative evidence, by scope &#8212; produced by ETI360 from your trip data</text>

  <!-- Column 1 header: Organizational Assurance -->
  <rect x="28" y="76" width="304" height="40" rx="2" fill="#0d3558"/>
  <text x="180" y="96" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Tier 1 &#8212; Organizational Baseline</text>
  <text x="180" y="130" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#4c5968">Annual</text>

  <!-- Column 2 header: Trip Assurance -->
  <rect x="348" y="76" width="304" height="40" rx="2" fill="#0d3558"/>
  <text x="500" y="96" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Tier 2 &#8212; Trip Risk Review</text>
  <text x="500" y="130" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#4c5968">Per trip &#8212; the primary engagement</text>

  <!-- Column 3 header: Field Assurance -->
  <rect x="668" y="76" width="304" height="40" rx="2" fill="#0d3558"/>
  <text x="820" y="96" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Tier 3 &#8212; Dynamic Risk Operations</text>
  <text x="820" y="130" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#4c5968">Per trip &#8212; in the field</text>

  <!-- ── Column 1 cards ── -->
  <!-- ISO 31031 Audit Report -->
  <rect x="28" y="144" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <path d="M 52 164 L 60 167 L 60 174 Q 60 180 52 183 Q 44 180 44 174 L 44 167 Z" stroke="#0d3558" stroke-width="1.5" fill="none"/>
  <text x="80" y="172" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">ISO 31031 Audit Report</text>
  <!-- Organizational Baseline -->
  <rect x="28" y="216" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="44" y="236" width="18" height="3" rx="1" fill="#0d3558"/>
  <rect x="44" y="242" width="18" height="3" rx="1" fill="#0d3558"/>
  <rect x="44" y="248" width="12" height="3" rx="1" fill="#0d3558"/>
  <text x="80" y="244" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Organizational Baseline</text>
  <!-- SOP Coverage Analysis -->
  <rect x="28" y="288" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="44" y="322" width="5" height="8" fill="#0d3558"/>
  <rect x="52" y="316" width="5" height="14" fill="#0d3558"/>
  <rect x="60" y="310" width="5" height="20" fill="#0d3558"/>
  <text x="80" y="316" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">SOP Coverage Analysis</text>

  <!-- ── Column 2 cards ── -->
  <!-- Trip Options Brief -->
  <rect x="348" y="144" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="364" y="164" width="18" height="3" rx="1" fill="#0d3558"/>
  <rect x="364" y="170" width="18" height="3" rx="1" fill="#0d3558"/>
  <rect x="364" y="176" width="12" height="3" rx="1" fill="#0d3558"/>
  <text x="400" y="172" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Trip Options Brief</text>
  <!-- RAMS Report -->
  <rect x="348" y="216" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="364" y="234" width="8" height="8" fill="none" stroke="#0d3558" stroke-width="1.2"/>
  <rect x="375" y="234" width="8" height="8" fill="#0d3558"/>
  <rect x="364" y="245" width="8" height="8" fill="#0d3558"/>
  <rect x="375" y="245" width="8" height="8" fill="none" stroke="#0d3558" stroke-width="1.2"/>
  <text x="400" y="244" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">RAMS Report</text>
  <!-- Activity Risk Profile -->
  <rect x="348" y="288" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="364" y="322" width="5" height="8" fill="#0d3558"/>
  <rect x="372" y="314" width="5" height="16" fill="#0d3558"/>
  <rect x="380" y="318" width="5" height="12" fill="#0d3558"/>
  <text x="400" y="316" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Activity Risk Profile</text>
  <!-- Trip Stress Test -->
  <rect x="348" y="360" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <path d="M 362 398 Q 370 398 373 388 Q 376 378 379 388 Q 382 398 390 398" stroke="#0d3558" stroke-width="1.5" fill="none"/>
  <text x="400" y="388" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Trip Stress Test</text>
  <!-- Weather & Climate Brief -->
  <rect x="348" y="432" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <circle cx="373" cy="460" r="6" stroke="#0d3558" stroke-width="1.5" fill="none"/>
  <line x1="373" y1="448" x2="373" y2="451" stroke="#0d3558" stroke-width="1.5"/>
  <line x1="373" y1="469" x2="373" y2="472" stroke="#0d3558" stroke-width="1.5"/>
  <line x1="361" y1="460" x2="364" y2="460" stroke="#0d3558" stroke-width="1.5"/>
  <line x1="382" y1="460" x2="385" y2="460" stroke="#0d3558" stroke-width="1.5"/>
  <text x="400" y="460" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Weather &amp; Climate Brief</text>
  <!-- Parent Information Pack -->
  <rect x="348" y="504" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <circle cx="373" cy="526" r="5" stroke="#0d3558" stroke-width="1.5" fill="none"/>
  <path d="M 364 540 A 9 9 0 0 1 382 540" stroke="#0d3558" stroke-width="1.5" fill="none"/>
  <text x="400" y="532" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Parent Information Pack</text>

  <!-- ── Column 3 cards ── -->
  <!-- RESPOND Card -->
  <rect x="668" y="144" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="684" y="162" width="20" height="14" rx="2" fill="none" stroke="#0d3558" stroke-width="1.5"/>
  <line x1="688" y1="169" x2="700" y2="169" stroke="#0d3558" stroke-width="1.2"/>
  <text x="720" y="172" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">RESPOND Card</text>
  <!-- RESPOND Action Cards -->
  <rect x="668" y="216" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="684" y="232" width="18" height="13" rx="2" fill="none" stroke="#0d3558" stroke-width="1.2"/>
  <rect x="688" y="237" width="18" height="13" rx="2" fill="#ffffff" stroke="#0d3558" stroke-width="1.5"/>
  <text x="720" y="244" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">RESPOND Action Cards</text>
  <!-- Daily Brief -->
  <rect x="668" y="288" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <rect x="684" y="306" width="18" height="3" rx="1" fill="#0d3558"/>
  <rect x="684" y="312" width="18" height="3" rx="1" fill="#0d3558"/>
  <rect x="684" y="318" width="12" height="3" rx="1" fill="#0d3558"/>
  <text x="720" y="316" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Daily Brief</text>
  <!-- Activity Safety Cards -->
  <rect x="668" y="360" width="304" height="56" rx="2" fill="#ffffff" stroke="#e3e8ee" stroke-width="1"/>
  <path d="M 693 378 L 702 381 L 702 389 Q 702 396 693 399 Q 684 396 684 389 L 684 381 Z" stroke="#0d3558" stroke-width="1.5" fill="none"/>
  <text x="720" y="388" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d3558">Activity Safety Cards</text>

  <text x="992" y="602" text-anchor="end" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="10" fill="#4c5968" opacity="0.5">ETI360</text>
</svg>
