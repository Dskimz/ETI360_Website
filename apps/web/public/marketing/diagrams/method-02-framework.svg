<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d3558"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a72c"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c5968"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="464" fill="#fafbfc"/>
  <rect x="0" y="0" width="800" height="4" fill="#d4a72c"/>
  <text x="24" y="28" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700" fill="#0d3558">One program. Three tiers.</text>
  <text x="24" y="46" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#4c5968">The ETI360 Risk Framework carrying the eight-stage governance cycle</text>

  <!-- Band 1: Tier 1 — Organizational Baseline -->
  <rect x="24" y="84" width="752" height="96" rx="2" fill="#0d3558"/>
  <text x="44" y="122" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tier 1 &#8212; Organizational Baseline</text>
  <text x="44" y="146" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.75">Annual &#8212; standing evidence, referenced by every trip rather than repeated</text>
  <rect x="708" y="120" width="56" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="736" y="132" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Audit</text>

  <!-- Band 2: Tier 2 — Trip Risk Review -->
  <rect x="24" y="196" width="752" height="96" rx="2" fill="#1a4a72"/>
  <text x="44" y="234" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tier 2 &#8212; Trip Risk Review</text>
  <text x="44" y="258" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.75">Per trip &#8212; the evidence base built before departure</text>
  <rect x="436" y="232" width="72" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="472" y="244" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Selection</text>
  <rect x="516" y="232" width="52" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="542" y="244" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Lock</text>
  <rect x="576" y="232" width="56" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="604" y="244" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Agree</text>
  <rect x="640" y="232" width="60" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="670" y="244" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Assess</text>
  <rect x="708" y="232" width="64" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="740" y="244" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Control</text>

  <!-- Band 3: Tier 3 — Dynamic Risk Operations -->
  <rect x="24" y="308" width="752" height="96" rx="2" fill="#2a6090"/>
  <text x="44" y="346" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Tier 3 &#8212; Dynamic Risk Operations</text>
  <text x="44" y="370" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.75">Per trip &#8212; live evidence while the trip runs, closing back into the baseline</text>
  <rect x="656" y="344" width="44" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="678" y="356" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Run</text>
  <rect x="708" y="344" width="60" height="24" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="738" y="356" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="11" fill="#ffffff">Review</text>

  <!-- Binding sentence -->
  <text x="24" y="440" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#0d3558">Prove the organization once, prove each trip, equip the field.</text>

  <text x="792" y="458" text-anchor="end" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="10" fill="#4c5968" opacity="0.5">ETI360</text>
</svg>
